<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111317" />
    <meta name="description" content="Nimbus - a mobile-first weather forecast app." />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('weather-app:settings')
          var theme = raw ? JSON.parse(raw).theme : 'dark'
          var isDark = theme !== 'light'
          document.documentElement.classList.toggle('dark', isDark)
          document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#111317' : '#b8daf5')
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <title>Nimbus Weather</title>
  </head>
  <body class="bg-background text-on-surface antialiased">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
